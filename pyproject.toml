[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linscreencapture2"
version = "2.0.0-alpha0"
description = "LinScreenCapture 2 - GTK4/Python screenshot tool with the Studio Editor (Photoshop x Snagit hybrid)"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["linscreencapture2*", "lintheme*"]
